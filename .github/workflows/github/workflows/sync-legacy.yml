
name: Sync Legacy Branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout upstream legacy
        uses: actions/checkout@v4
        with:
          repository: KernelSU-Next/KernelSU-Next
          ref: legacy
          fetch-depth: 0
          path: upstream

      - name: Push legacy to fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git -C upstream push \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/legacy
